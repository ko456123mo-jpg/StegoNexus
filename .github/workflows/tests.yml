name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install optional forensic tools (best effort)
        # The app reports missing tools as UNAVAILABLE instead of failing,
        # so this step is intentionally non-blocking.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exiftool steghide binwalk foremost ffmpeg \
            file binutils libimage-exiftool-perl >/dev/null

      - name: Tool availability report
        run: |
          for t in exiftool steghide binwalk foremost ffmpeg ffprobe file strings tshark; do
            printf '%-10s %s\n' "$t" "$(command -v $t || echo UNAVAILABLE)"
          done

      - name: Generate demo artifacts (excluded from git)
        run: python demo.py || echo "::warning::demo.py reported an issue"

      - name: Run integration + requirements suites
        run: |
          python tests/test_integration.py
          python tests/test_requirements.py

      - name: Run readiness suite
        run: python tests/test_readiness.py
